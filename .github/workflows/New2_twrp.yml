name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cleanup and Free Disk Space
      run: |
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Set Up Git Config
      run: |
        git config --global user.name "uratsakidogi1488"
        git config --global user.email "uratsakidogi1488@github.com"

    - name: Initialize Repo and Sync Sources
      run: |
        mkdir twrp
        cd twrp
        # Инициализируем минимальный манифест TWRP 11
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        # Копируем локальный манифест в нужное место, чтобы подтянуть дерево
        mkdir -p .repo/local_manifests
        
        # Синхронизируем исходники
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Prepare Device Tree
      run: |
        # Копируем твое дерево устройства внутрь синхронизированных исходников
        mkdir -p twrp/device/oukitel/WP15
        cp -r * twrp/device/oukitel/WP15/ || true

    - name: Build TWRP Image
      run: |
        cd twrp
        # Обезопасим сборку: обнулим капризный аудио-эффект, чтобы компилятор не спотыкался
        if [ -f hardware/interfaces/audio/effect/all-versions/default/Android.bp ]; then
          echo "" > hardware/interfaces/audio/effect/all-versions/default/Android.bp
        fi
        
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_WP15-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Oukitel-WP15
        path: twrp/out/target/product/WP15/recovery.img
